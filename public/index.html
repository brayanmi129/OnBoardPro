<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnBoardPro — Dev Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #4f46e5;
      --primary-dark:  #3730a3;
      --sidebar-bg:    #1e1b4b;
      --sidebar-text:  #a5b4fc;
      --sidebar-hover: rgba(255,255,255,0.07);
      --sidebar-active:#312e81;
      --bg:            #f1f5f9;
      --card:          #ffffff;
      --text:          #0f172a;
      --muted:         #64748b;
      --border:        #e2e8f0;
      --danger:        #ef4444;
      --success:       #22c55e;
      --radius:        8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* ── LOGIN ─────────────────────────────────────────── */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 400px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.35);
    }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-logo h1 { font-size: 26px; font-weight: 800; color: var(--primary); }
    .login-logo p  { font-size: 13px; color: var(--muted); margin-top: 4px; }

    /* ── APP ───────────────────────────────────────────── */
    #app {
      display: grid;
      grid-template-columns: 224px 1fr;
      height: 100vh;
    }

    /* ── SIDEBAR ───────────────────────────────────────── */
    #sidebar {
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-logo {
      padding: 22px 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-logo h2  { color: white; font-size: 17px; font-weight: 700; }
    .sidebar-logo span{ font-size: 11px; color: rgba(165,180,252,0.6); }

    .nav-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      color: rgba(165,180,252,0.45); text-transform: uppercase;
      padding: 18px 20px 6px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; color: var(--sidebar-text);
      cursor: pointer; font-size: 14px;
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }
    .nav-item:hover  { background: var(--sidebar-hover); }
    .nav-item.active { background: var(--sidebar-active); color: white; border-left-color: var(--primary); }
    .nav-icon { width: 20px; text-align: center; font-size: 15px; }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-user { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--primary); color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .user-name  { font-size: 13px; color: white; font-weight: 600; }
    .user-role  { font-size: 11px; color: var(--sidebar-text); text-transform: capitalize; }

    /* ── MAIN ──────────────────────────────────────────── */
    #main { display: flex; flex-direction: column; overflow: hidden; }

    .topbar {
      background: white; border-bottom: 1px solid var(--border);
      height: 58px; padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .topbar h2 { font-size: 18px; font-weight: 700; }
    .topbar-right { display: flex; gap: 8px; align-items: center; }
    .api-pill {
      font-size: 12px; background: #f1f5f9; border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px; color: var(--muted);
      font-family: monospace;
    }

    #content { flex: 1; overflow-y: auto; padding: 28px; }

    /* ── CARDS ─────────────────────────────────────────── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-bottom: 20px;
    }
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; text-align: center;
    }
    .stat-value { font-size: 28px; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* ── TABLES ────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th {
      text-align: left; padding: 11px 16px;
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border); background: #f8fafc;
    }
    tbody td { padding: 13px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }

    /* ── BADGES ────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .b-superadmin { background: #fef3c7; color: #92400e; }
    .b-admin      { background: #ede9fe; color: #5b21b6; }
    .b-instructor { background: #dbeafe; color: #1e40af; }
    .b-student    { background: #dcfce7; color: #166534; }
    .b-Active     { background: #dcfce7; color: #166534; }
    .b-Inactive   { background: #fee2e2; color: #991b1b; }
    .b-default    { background: #f1f5f9; color: #475569; }

    /* ── BUTTONS ───────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border: none; border-radius: 6px;
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-primary{ background: var(--primary); color: white; }
    .btn-danger { background: var(--danger);  color: white; }
    .btn-ghost  { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg); opacity: 1; }
    .btn-full   { width: 100%; justify-content: center; }
    .btn-sm     { padding: 4px 10px; font-size: 12px; }
    .btn-oauth  {
      background: white; color: var(--text); border: 1px solid var(--border);
      width: 100%; justify-content: center; margin-bottom: 10px;
    }
    .btn-logout {
      width: 100%; justify-content: center; font-size: 13px;
      background: rgba(239,68,68,0.1); color: #ef4444;
      border: none;
    }

    /* ── FORMS ─────────────────────────────────────────── */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .form-group label .hint { font-weight: 400; color: var(--muted); }
    .form-group input,
    .form-group select {
      width: 100%; padding: 9px 12px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; outline: none; background: white;
      transition: border-color 0.15s;
    }
    .form-group input:focus,
    .form-group select:focus { border-color: var(--primary); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      color: var(--muted); font-size: 13px; margin: 18px 0;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px; background: var(--border);
    }

    /* ── MODAL ─────────────────────────────────────────── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; backdrop-filter: blur(2px);
    }
    .modal-box {
      background: white; border-radius: 12px; padding: 32px;
      width: 440px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 22px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }

    /* ── ALERTS ────────────────────────────────────────── */
    .alert {
      padding: 11px 14px; border-radius: 6px;
      font-size: 14px; margin-bottom: 14px;
    }
    .alert-error   { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-warning { background: #fff7ed; color: #92400e; border: 1px solid #fed7aa; }
    .alert-info    { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

    /* ── MISC ──────────────────────────────────────────── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .section-count { font-size: 15px; font-weight: 600; }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 38px; display: block; margin-bottom: 10px; }

    .mono { font-family: monospace; font-size: 12px; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }

    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .profile-item label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--muted); display: block;
    }
    .profile-item p { font-size: 15px; font-weight: 500; margin-top: 2px; }

    .xp-bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .xp-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #818cf8); border-radius: 4px; transition: width 0.5s; }
  </style>
</head>
<body>

<!-- ═══════════════════ LOGIN ════════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <h1>🎓 OnBoardPro</h1>
      <p>Panel de desarrollo y pruebas</p>
    </div>

    <div id="login-alert"></div>

    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input id="in-email" type="email" placeholder="admin@onboardpro.com" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input id="in-pass" type="password" placeholder="••••••••" required>
      </div>
      <button class="btn btn-primary btn-full" type="submit">Iniciar sesión</button>
    </form>

    <div class="divider">o continúa con</div>

    <button class="btn btn-oauth" onclick="oauthLogin('google')">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Google
    </button>

    <button class="btn btn-oauth" onclick="oauthLogin('microsoft')">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#f25022" d="M1 1h10v10H1z"/>
        <path fill="#00a4ef" d="M13 1h10v10H13z"/>
        <path fill="#7fba00" d="M1 13h10v10H1z"/>
        <path fill="#ffb900" d="M13 13h10v10H13z"/>
      </svg>
      Microsoft
    </button>

    <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border)">
      <div class="form-group" style="margin-bottom:0">
        <label style="font-size:12px;color:var(--muted)">URL de la API</label>
        <input id="in-api-url" value="" placeholder="http://localhost:3000">
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════ APP ═════════════════════════════════════════════════ -->
<div id="app" style="display:none">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <h2>🎓 OnBoardPro</h2>
      <span>Dev Panel</span>
    </div>

    <div class="nav-label">Principal</div>
    <div class="nav-item active" data-nav="dashboard" onclick="navigate('dashboard')">
      <span class="nav-icon">📊</span> Dashboard
    </div>

    <div class="nav-label">Plataforma</div>
    <div class="nav-item superadmin-only" data-nav="tenants" onclick="navigate('tenants')" style="display:none">
      <span class="nav-icon">🏢</span> Tenants
    </div>
    <div class="nav-item admin-only" data-nav="users" onclick="navigate('users')" style="display:none">
      <span class="nav-icon">👥</span> Usuarios
    </div>

    <div class="nav-label">Contenido</div>
    <div class="nav-item" data-nav="courses" onclick="navigate('courses')">
      <span class="nav-icon">📚</span> Cursos
    </div>
    <div class="nav-item" data-nav="groups" onclick="navigate('groups')">
      <span class="nav-icon">🗂️</span> Grupos
    </div>
    <div class="nav-item" data-nav="activities" onclick="navigate('activities')">
      <span class="nav-icon">📝</span> Actividades
    </div>

    <div class="nav-label">Gamificación</div>
    <div class="nav-item" data-nav="ranking" onclick="navigate('ranking')">
      <span class="nav-icon">🏆</span> Ranking
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar" id="s-avatar">?</div>
        <div>
          <div class="user-name"  id="s-name">...</div>
          <div class="user-role"  id="s-role">...</div>
        </div>
      </div>
      <button class="btn btn-logout" onclick="logout()">🚪 Cerrar sesión</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div id="main">
    <div class="topbar">
      <h2 id="page-title">Dashboard</h2>
      <div class="topbar-right">
        <span class="api-pill" id="api-pill">localhost:3000</span>
        <button class="btn btn-ghost" onclick="refreshPage()" title="Recargar" style="font-size:18px;padding:5px 10px">↻</button>
      </div>
    </div>
    <div id="content">
      <div class="empty-state"><span class="icon">⏳</span>Cargando...</div>
    </div>
  </div>
</div>

<!-- ═══════════════════ MODAL ════════════════════════════════════════════════ -->
<div id="modal" class="overlay" style="display:none" onclick="overlayClick(event)">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="modal-ok">Guardar</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════════════
let API = localStorage.getItem("onbp_api") || window.location.origin;
const $ = id => document.getElementById(id);

const state = { token: null, user: null, section: "dashboard" };

// ═══════════════════════════════════════════════════════════════════════════
// API HELPER
// ═══════════════════════════════════════════════════════════════════════════
async function api(method, path, body) {
  const res = await fetch(`${API}${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({ message: res.statusText }));
  if (!res.ok) throw data;
  return data;
}

// ═══════════════════════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════════════════════
$("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  saveApiUrl();
  loginAlert("");
  try {
    const data = await api("POST", "/api/auth/localuser", {
      email:    $("in-email").value,
      password: $("in-pass").value,
    });
    afterLogin(data.token, data.userData);
  } catch (err) {
    loginAlert(err.message || "Error al iniciar sesión");
  }
});

function oauthLogin(provider) {
  saveApiUrl();
  window.location.href = `${API}/api/auth/${provider}`;
}

function saveApiUrl() {
  const val = $("in-api-url").value.replace(/\/$/, "");
  if (val) { API = val; localStorage.setItem("onbp_api", API); }
}

function afterLogin(token, user) {
  state.token = token;
  state.user  = user;
  localStorage.setItem("onbp_token", token);
  showApp();
}

function logout() {
  state.token = null; state.user = null;
  localStorage.removeItem("onbp_token");
  $("app").style.display   = "none";
  $("login-screen").style.display = "flex";
}

async function loadMe() {
  const data = await api("GET", "/api/auth/me");
  state.user = data.userData;
}

function loginAlert(msg) {
  $("login-alert").innerHTML = msg
    ? `<div class="alert alert-error">${msg}</div>`
    : "";
}

// ═══════════════════════════════════════════════════════════════════════════
// APP SHELL
// ═══════════════════════════════════════════════════════════════════════════
function showApp() {
  $("login-screen").style.display = "none";
  $("app").style.display = "grid";
  $("api-pill").textContent = API.replace(/https?:\/\//, "");
  updateSidebar();
  navigate("dashboard");
}

function updateSidebar() {
  const u = state.user;
  if (!u) return;
  const initials = ((u.firstname?.[0] ?? "") + (u.lastname?.[0] ?? "")).toUpperCase() || u.email?.[0]?.toUpperCase() || "?";
  $("s-avatar").textContent = initials;
  $("s-name").textContent   = [u.firstname, u.lastname].filter(Boolean).join(" ") || u.email;
  $("s-role").textContent   = u.role;

  // Visibilidad por rol
  const isSA    = u.role === "superadmin";
  const isAdmin = ["admin", "superadmin"].includes(u.role);
  document.querySelectorAll(".superadmin-only").forEach(el => el.style.display = isSA    ? "flex" : "none");
  document.querySelectorAll(".admin-only").forEach(el =>      el.style.display = isAdmin ? "flex" : "none");
}

// ═══════════════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════════════
const pageTitles = {
  dashboard:  "📊 Dashboard",
  tenants:    "🏢 Tenants",
  users:      "👥 Usuarios",
  courses:    "📚 Cursos",
  groups:     "🗂️ Grupos",
  activities: "📝 Actividades",
  ranking:    "🏆 Ranking",
};

const renderers = {
  dashboard:  renderDashboard,
  tenants:    renderTenants,
  users:      renderUsers,
  courses:    renderCourses,
  groups:     renderGroups,
  activities: renderActivities,
  ranking:    renderRanking,
};

function navigate(section) {
  state.section = section;
  $("page-title").textContent = pageTitles[section] ?? section;
  document.querySelectorAll(".nav-item").forEach(el => {
    el.classList.toggle("active", el.dataset.nav === section);
  });
  setContent(`<div class="empty-state"><span class="icon">⏳</span>Cargando...</div>`);
  renderers[section]?.();
}

function refreshPage() { navigate(state.section); }

// ═══════════════════════════════════════════════════════════════════════════
// RENDER HELPERS
// ═══════════════════════════════════════════════════════════════════════════
function setContent(html) { $("content").innerHTML = html; }

function badge(val, cssClass) {
  return `<span class="badge ${cssClass ?? "b-default"}">${val ?? "—"}</span>`;
}

const roleCls   = { superadmin:"b-superadmin", admin:"b-admin", instructor:"b-instructor", student:"b-student" };
const statusCls = { Active:"b-Active", Inactive:"b-Inactive" };

function roleBadge(r)   { return badge(r, roleCls[r]); }
function statusBadge(s) { return badge(s, statusCls[s]); }

function sectionHeader(countLabel, btnLabel, btnFn) {
  return `
    <div class="section-header">
      <span class="section-count">${countLabel}</span>
      ${btnLabel ? `<button class="btn btn-primary btn-sm" onclick="${btnFn}()">＋ ${btnLabel}</button>` : ""}
    </div>`;
}

function tableWrap(headCols, bodyRows) {
  const ths = headCols.map(c => `<th>${c}</th>`).join("");
  return `
    <div class="card" style="padding:0">
      <div class="table-wrap">
        <table>
          <thead><tr>${ths}</tr></thead>
          <tbody>${bodyRows || `<tr><td colspan="${headCols.length}" style="text-align:center;padding:40px;color:var(--muted)">Sin resultados</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}

function tr(...cells) {
  return `<tr>${cells.map(c => `<td>${c ?? "—"}</td>`).join("")}</tr>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════════════════════
async function renderDashboard() {
  try {
    await loadMe();
    updateSidebar();
    const u = state.user;
    const xpNext = (u.level + 1) * 100;
    const xpPct  = Math.min(100, Math.round((u.xp / xpNext) * 100));
    const name   = [u.firstname, u.lastname].filter(Boolean).join(" ") || u.email;
    const initials = ((u.firstname?.[0] ?? "") + (u.lastname?.[0] ?? "")).toUpperCase() || "?";

    setContent(`
      <div class="card" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
        <div style="width:60px;height:60px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:white;font-size:22px;font-weight:800;flex-shrink:0">${initials}</div>
        <div style="flex:1">
          <div style="font-size:20px;font-weight:700">${name}</div>
          <div class="muted small">${u.email}</div>
          <div style="margin-top:6px">${roleBadge(u.role)} ${statusBadge(u.status)}</div>
        </div>
        <div style="text-align:right">
          <div class="small muted">Tenant ID</div>
          <code class="small">${u.tenantId || "— (plataforma)"}</code>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value">⭐ ${u.level}</div>
          <div class="stat-label">Nivel</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">✨ ${u.xp}</div>
          <div class="stat-label">XP</div>
          <div class="xp-bar"><div class="xp-fill" style="width:${xpPct}%"></div></div>
          <div class="small muted" style="margin-top:4px">${u.xp} / ${xpNext} → nivel ${u.level+1}</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">🔥 ${u.streak ?? 0}</div>
          <div class="stat-label">Racha</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">📋 ${u.missions ?? "0/0"}</div>
          <div class="stat-label">Misiones</div>
        </div>
      </div>

      <div class="card" style="background:#f8fafc">
        <div class="small" style="font-weight:700;color:var(--muted);margin-bottom:8px">🔑 TOKEN JWT ACTIVO</div>
        <div style="font-family:monospace;font-size:11px;word-break:break-all;background:white;padding:10px;border-radius:6px;border:1px solid var(--border);color:#475569">${state.token}</div>
        <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="navigator.clipboard.writeText('${state.token}');this.textContent='¡Copiado!'">📋 Copiar token</button>
      </div>
    `);
  } catch (err) {
    setContent(`<div class="alert alert-error">${err.message || "Error al cargar el dashboard"}</div>`);
  }
}

    <div class="form-group"><label>Contraseña <span class="hint">(vacío = solo OAuth)</span></label><input id="f-u-pw" type="password" placeholder="contraseña123"></div>
    <div class="form-group"><label>Rol</label>

// ═══════════════════════════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════════════════════════
let modalCb = null;

function openModal(title, bodyHtml, onConfirm) {
  $("modal-title").textContent = title;
  $("modal-body").innerHTML    = bodyHtml;
  modalCb = onConfirm;
  $("modal").style.display = "flex";

  $("modal-ok").onclick = async () => {
    const btn = $("modal-ok");
    btn.textContent = "Guardando..."; btn.disabled = true;
    document.querySelectorAll("#modal-body .alert-error").forEach(el => el.remove());
    try {
      await modalCb();
    } catch (err) {
      $("modal-body").insertAdjacentHTML("afterbegin",
        `<div class="alert alert-error">${err.message || JSON.stringify(err)}</div>`
      );
    } finally {
      btn.textContent = "Guardar"; btn.disabled = false;
    }
  };
}

function closeModal() { $("modal").style.display = "none"; modalCb = null; }
function overlayClick(e) { if (e.target.id === "modal") closeModal(); }

// ═══════════════════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════════════════
function escHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
(async function init() {
  // Detectar token OAuth en la URL (?token=...)
  const params   = new URLSearchParams(window.location.search);
  const urlToken = params.get("token");
  const reason   = params.get("reason");
  window.history.replaceState({}, "", window.location.pathname);

  // Restaurar URL de API guardada
  $("in-api-url").value = API;

  if (urlToken && urlToken !== "Fail") {
    state.token = urlToken;
    localStorage.setItem("onbp_token", urlToken);
    try { await loadMe(); showApp(); return; } catch { /* token inválido */ }
  }

  if (urlToken === "Fail") {
    loginAlert(reason ? decodeURIComponent(reason) : "Falló el inicio de sesión con OAuth");
    return;
  }

  // Restaurar sesión guardada
  const saved = localStorage.getItem("onbp_token");
  if (saved) {
    state.token = saved;
    try { await loadMe(); showApp(); return; } catch { localStorage.removeItem("onbp_token"); }
  }
})();
</script>
